name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./...

  build:
    name: Build linux/${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
        run: go build -trimpath -buildvcs=false -o why ./cmd/why

      - name: Verify binary type
        run: file why

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: why-linux-${{ matrix.arch }}
          path: why
          if-no-files-found: error

  integration:
    name: ptrace integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Why and fixture
        env:
          CGO_ENABLED: "0"
        run: |
          go build -buildvcs=false -o /tmp/why ./cmd/why
          go build -buildvcs=false -o /tmp/why-bindfail ./tests/fixtures/bindfail

      - name: Diagnose address already in use
        run: bash tests/integration/bind_address_in_use.sh /tmp/why /tmp/why-bindfail
