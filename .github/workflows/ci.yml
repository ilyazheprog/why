name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Check installer syntax
        run: bash -n site/install.sh

      - name: Test installer end to end
        run: bash tests/integration/installer.sh "$GITHUB_WORKSPACE"

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...

      - name: Run race detector
        run: go test -race ./...

  build:
    name: Build linux/amd64
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -buildvcs=false -o why ./cmd/why

      - name: Verify binary type
        run: file why

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: why-linux-amd64
          path: why
          if-no-files-found: error

  build-arm64:
    name: Cross-build linux/arm64 (experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: go build -trimpath -buildvcs=false -o why ./cmd/why

      - name: Verify ARM64 binary type
        run: |
          file why | grep -q 'ARM aarch64'
          if file why | grep -q 'dynamically linked'; then
            echo "ARM64 binary is dynamically linked" >&2
            exit 1
          fi

  integration:
    name: ptrace integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Why and fixture
        env:
          CGO_ENABLED: "0"
        run: |
          go build -buildvcs=false -o /tmp/why ./cmd/why
          go build -buildvcs=false -o /tmp/why-bindfail ./tests/fixtures/bindfail
          go build -buildvcs=false -o /tmp/why-connectfail ./tests/fixtures/connectfail
          go build -buildvcs=false -o /tmp/why-filefail ./tests/fixtures/filefail
          go build -buildvcs=false -o /tmp/why-patchneeded ./tests/fixtures/patchneeded

      - name: Diagnose address already in use
        run: bash tests/integration/bind_address_in_use.sh /tmp/why /tmp/why-bindfail

      - name: Diagnose refused connections
        run: bash tests/integration/connect_refused.sh /tmp/why /tmp/why-bindfail /tmp/why-connectfail

      - name: Diagnose filesystem failures
        run: bash tests/integration/filesystem_failures.sh /tmp/why /tmp/why-filefail

      - name: Diagnose missing ELF libraries
        run: bash tests/integration/missing_library.sh /tmp/why /tmp/why-patchneeded

      - name: Diagnose signal termination
        run: bash tests/integration/signal_termination.sh /tmp/why

      - name: Enforce Why timeout across process tree
        run: bash tests/integration/timeout.sh /tmp/why

      - name: Diagnose command execution failures
        run: bash tests/integration/exec_failures.sh /tmp/why "$GITHUB_WORKSPACE"
